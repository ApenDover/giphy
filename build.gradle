plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'checkstyle'
	id 'pmd'
}

group = 'ts.andrey'
version = '0.0.1'

java {
	sourceCompatibility = '21'
}

ext {
	set('springCloudVersion', "2023.0.3")
}

repositories {
	mavenCentral()
}

dependencies {
	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'com.neovisionaries:nv-i18n:1.24'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}


apply plugin: 'checkstyle'
apply plugin: 'pmd'
//apply plugin: 'com.github.spotbugs'

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('deploy') {
	doLast {
		def remoteServer = 'root@ts.andrey.o.fvds.ru'
		def remotePath = '~/docfiles'

		// Загрузка Dockerfile и docker-compose.yml на удалённый сервер
		exec {
			commandLine 'scp', 'Dockerfile', 'docker-compose.yml', "${remoteServer}:${remotePath}"
		}

		// Выполнение команд на удалённом сервере
		exec {
			commandLine 'ssh', remoteServer, """
            cd ${remotePath} &&
            docker-compose down &&
            docker-compose up -d --build
            """
		}
	}
}

checkstyle {
	toolVersion '10.3.1'
}

pmd {
	consoleOutput = true
	ruleSets = ["${rootDir}/config/pmd/ruleset.xml"]
	sourceSets = [sourceSets.main]
}
